name: Setup ccache
description: Restore and configure ccache for the native llama.cpp build

runs:
  using: composite
  steps:
    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ccache-${{ runner.os }}-ndk-r27d-${{ hashFiles('smollm/src/main/cpp/**', 'smollm/build.gradle.kts', 'external/llama.cpp/CMakeLists.txt', 'external/llama.cpp/src/**', 'external/llama.cpp/common/**', 'external/llama.cpp/ggml/src/**', 'external/llama.cpp/include/**', 'external/cpu_features/**') }}
        restore-keys: |
          ccache-${{ runner.os }}-ndk-r27d-

    - name: Configure ccache
      shell: bash
      run: |
        if ! command -v ccache >/dev/null 2>&1; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache
        fi
        ccache --version
        ccache --max-size=500M
        ccache --zero-stats
        {
          echo "CCACHE_DIR=$HOME/.cache/ccache"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
          echo "CCACHE_NOHASHDIR=true"
          echo "CCACHE_COMPILERCHECK=content"
          echo "CCACHE_SLOPPINESS=time_macros"
          echo "CCACHE_HARDLINK=true"
          echo "CMAKE_COMPILER_LAUNCHER=ccache"
        } >> "$GITHUB_ENV"
