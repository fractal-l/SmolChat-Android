name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/*'
      - 'ci/*'
  workflow_dispatch:

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup ccache
        uses: ./.github/actions/setup-ccache

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint and run unit tests
        run: >-
          ./gradlew :app:lintDebug :app:testDebugUnitTest :hf-model-hub-api:test
          --stacktrace --build-cache -PtargetAbi=arm64-v8a

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            hf-model-hub-api/build/reports/tests/
